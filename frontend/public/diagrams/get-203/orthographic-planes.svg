<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="First-angle orthographic projection showing VP above XY and HP below XY">
  <rect width="640" height="280" rx="14" fill="#FFFFFF"/>
  <!-- Left: 2D Schematic of First Quadrant Fold -->
  <g transform="translate(24,20)">
    <text x="0" y="18" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#141413">1. First-Angle Planes (Side View)</text>
    <!-- VP vertical line -->
    <line x1="80" y1="45" x2="80" y2="175" stroke="#141413" stroke-width="2.5"/>
    <text x="48" y="64" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#EA580C">VP</text>
    <!-- HP horizontal line -->
    <line x1="80" y1="175" x2="235" y2="175" stroke="#141413" stroke-width="2.5"/>
    <text x="210" y="164" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F766E">HP</text>
    <!-- Object point P in first quadrant -->
    <circle cx="155" cy="110" r="5" fill="#EA580C"/>
    <text x="165" y="106" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#141413">P (object)</text>
    <!-- Projectors -->
    <line x1="155" y1="110" x2="80" y2="110" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4 4"/>
    <circle cx="80" cy="110" r="3.5" fill="#EA580C"/>
    <text x="58" y="114" font-family="system-ui,sans-serif" font-size="11" fill="#EA580C">p'</text>
    <line x1="155" y1="110" x2="155" y2="175" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4 4"/>
    <circle cx="155" cy="175" r="3.5" fill="#0F766E"/>
    <text x="150" y="192" font-family="system-ui,sans-serif" font-size="11" fill="#0F766E">p</text>
    <!-- Rotation arrow showing HP swings 90 deg down -->
    <path d="M 195 182 A 60 60 0 0 1 135 232" fill="none" stroke="#EA580C" stroke-width="1.6" stroke-dasharray="3 3"/>
    <polygon points="135,232 143,225 144,234" fill="#EA580C"/>
    <text x="148" y="232" font-family="system-ui,sans-serif" font-size="11" fill="#4B5563">HP rotates 90° down</text>
  </g>
  <!-- Divider -->
  <line x1="305" y1="24" x2="305" y2="256" stroke="#E6E4DD" stroke-width="1.5"/>
  <!-- Right: Unfolded Orthographic Drawing -->
  <g transform="translate(330,20)">
    <text x="0" y="18" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#141413">2. Flat Drawing Sheet (2D)</text>
    <rect x="8" y="38" width="270" height="90" fill="#FFF7ED" rx="6"/>
    <rect x="8" y="132" width="270" height="95" fill="#F0FDFA" rx="6"/>
    <!-- XY line -->
    <line x1="0" y1="130" x2="286" y2="130" stroke="#141413" stroke-width="2"/>
    <text x="2" y="123" font-family="monospace" font-size="12" font-weight="700" fill="#141413">X</text>
    <text x="275" y="123" font-family="monospace" font-size="12" font-weight="700" fill="#141413">Y</text>
    <!-- Vertical projector -->
    <line x1="145" y1="72" x2="145" y2="188" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 4"/>
    <circle cx="145" cy="72" r="4.5" fill="#EA580C"/>
    <text x="155" y="76" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#EA580C">p' (Front View on VP)</text>
    <text x="20" y="56" font-family="system-ui,sans-serif" font-size="11" fill="#9A3412">Above XY = height above HP</text>
    <circle cx="145" cy="188" r="4.5" fill="#0F766E"/>
    <text x="155" y="192" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F766E">p (Top View on HP)</text>
    <text x="20" y="216" font-family="system-ui,sans-serif" font-size="11" fill="#115E59">Below XY = distance in front of VP</text>
  </g>
</svg>
