<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 276" role="img" aria-label="Ball dropped from height h showing kinetic and potential energy at three positions, total mechanical energy Wh constant">
<rect width="560" height="276" rx="12" fill="#FFFFFF"/>
<text x="16" y="22" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#141413" text-anchor="start">Conservation of energy (Hibbeler Fig. 14–20)</text>
<line x1="40" y1="200" x2="520" y2="200" stroke="#141413" stroke-width="2.5" stroke-linecap="round"/><text x="520" y="222" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="end">Datum (ground)</text><circle cx="100" cy="50" r="10" fill="#FDE7D7" stroke="#EA580C" stroke-width="2"/><text x="100" y="28" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#141413" text-anchor="middle">Released from rest</text><text x="100" y="240" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle">V = Wh,  T = 0</text><circle cx="270" cy="125" r="10" fill="#FDE7D7" stroke="#EA580C" stroke-width="2"/><text x="270" y="103" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#141413" text-anchor="middle">Fallen h/2</text><text x="270" y="240" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle">T = Wh/2,  V = Wh/2</text><circle cx="440" cy="190" r="10" fill="#FDE7D7" stroke="#EA580C" stroke-width="2"/><text x="440" y="168" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#141413" text-anchor="middle">At the ground</text><text x="440" y="240" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle">V = 0,  T = Wh</text><line x1="40" y1="50" x2="40" y2="200" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round"/><line x1="35" y1="50" x2="45" y2="50" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round"/><line x1="35" y1="200" x2="45" y2="200" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round"/><text x="52" y="129" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">h</text><text x="300" y="262" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#141413" text-anchor="middle">E = T + V = Wh at every position (no friction)</text>
</svg>
