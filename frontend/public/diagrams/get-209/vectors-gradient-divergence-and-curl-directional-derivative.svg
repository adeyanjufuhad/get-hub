  <text x="20" y="258" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">∂φ/∂r = N′ · ∇φ = |∇φ| cos θ ≤ |∇φ|:  ∇φ gives the maximum rate of change</text>
