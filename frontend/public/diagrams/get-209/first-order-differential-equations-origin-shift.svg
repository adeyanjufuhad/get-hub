<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="370" fill="#ffffff" rx="8"/>
  <rect x="1" y="1" width="798" height="368" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Main Title -->
  <text x="400" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">
    Geometric Interpretation of §3.8: Equations Reducible to Homogeneous Form
  </text>

  <!-- LEFT PANEL: Case I (Example 8) -->
  <rect x="20" y="42" width="370" height="310" rx="6" fill="#fafaf8" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="205" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">
    Case I: a/A ≠ b/B  (Intersecting Lines — Example 8)
  </text>
  <text x="205" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">
    dy/dx = (x + 2y − 3) / (2x + y − 3)   ⇒   h = 1, k = 1
  </text>

  <!-- Original xy axes: origin at (120, 260), scale = 55px per unit -->
  <line x1="50" y1="260" x2="365" y2="260" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-dark)"/>
  <line x1="120" y1="320" x2="120" y2="105" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-dark)"/>
  <text x="362" y="275" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-style="italic" fill="#334155">x</text>
  <text x="108" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-style="italic" fill="#334155">y</text>
  <text x="110" y="274" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">O(0,0)</text>

  <!-- Shifted XY axes through (h,k) = (1,1) => pixel (175, 205) -->
  <line x1="55" y1="205" x2="365" y2="205" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>
  <line x1="175" y1="320" x2="175" y2="105" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>
  <text x="360" y="198" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#2563eb">X</text>
  <text x="183" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#2563eb">Y</text>

  <!-- Line 1: x + 2y - 3 = 0 => at x=-0.5 y=1.75 (92.5,163.75); at x=3 y=0 (285,260); at x=3.4 y=-0.2 (307,271) -->
  <line x1="76" y1="155.5" x2="312" y2="273.5" stroke="#0f172a" stroke-width="2"/>
  <text x="315" y="290" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">x + 2y − 3 = 0</text>

  <!-- Line 2: 2x + y - 3 = 0 => at x=0.2 y=2.6 (131,117); at x=1.5 y=0 (202.5,260); at x=1.9 y=-0.8 (224.5,304) -->
  <line x1="128" y1="111" x2="228" y2="311" stroke="#dc2626" stroke-width="2"/>
  <text x="234" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">2x + y − 3 = 0</text>

  <!-- Shift arrow from (0,0) to (1,1) -->
  <line x1="122" y1="258" x2="170" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="175" cy="205" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
  <text x="184" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">O'(h, k) = (1, 1)</text>

  <!-- Footer caption in Left Panel -->
  <text x="205" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e293b">
    Shift x = X + 1, y = Y + 1  ⇒  dY/dX = (X + 2Y)/(2X + Y)
  </text>

  <!-- RIGHT PANEL: Case II (Example 9) -->
  <rect x="410" y="42" width="370" height="310" rx="6" fill="#fafaf8" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="595" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">
    Case II: a/A = b/B  (Parallel Lines — Example 9)
  </text>
  <text x="595" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">
    dy/dx = (x + 2y − 1) / (x + 2y + 1)   ⇒   no finite (h, k)
  </text>

  <!-- xy axes: origin at (590, 215), scale = 55px per unit -->
  <line x1="435" y1="215" x2="755" y2="215" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-dark)"/>
  <line x1="590" y1="320" x2="590" y2="105" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-dark)"/>
  <text x="752" y="230" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-style="italic" fill="#334155">x</text>
  <text x="578" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-style="italic" fill="#334155">y</text>
  <text x="582" y="229" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">O</text>

  <!-- Parallel Line 1: x + 2y = 1 => at x=-2 y=1.5 (480,132.5); at x=2.6 y=-0.8 (733,259) -->
  <line x1="470" y1="127.5" x2="740" y2="262.5" stroke="#0f172a" stroke-width="2.2"/>
  <text x="742" y="253" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a">x + 2y − 1 = 0</text>

  <!-- Parallel Line 2: x + 2y = -1 => at x=-2.4 y=0.7 (458,176.5); at x=2 y=-1.5 (700,297.5) -->
  <line x1="455" y1="175" x2="725" y2="310" stroke="#dc2626" stroke-width="2.2"/>
  <text x="512" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">x + 2y + 1 = 0</text>

  <!-- Parallel level line z = x + 2y = 0 (dashed) -->
  <line x1="462" y1="151" x2="732" y2="286" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="642" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2563eb">Constant z = x + 2y</text>
  <line x1="640" y1="162" x2="615" y2="225" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr-blue)"/>

  <!-- Parallel gap indicator -->
  <text x="595" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e293b">
    Substitute z = x + 2y  ⇒  variables separate in (z, x)
  </text>
</svg>
