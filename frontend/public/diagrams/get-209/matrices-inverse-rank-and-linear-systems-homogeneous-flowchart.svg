<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330">
  <defs>
    <marker id="arrH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrHBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="680" height="330" rx="10" fill="#fafaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top box -->
  <rect x="165" y="20" width="350" height="52" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <text x="340" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#111827">System of Homogeneous Linear Equations</text>
  <text x="340" y="61" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563eb">AX = O</text>

  <!-- Arrow down -->
  <line x1="340" y1="72" x2="340" y2="106" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrH)"/>

  <!-- Middle box -->
  <rect x="230" y="112" width="220" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="340" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Always has a solution</text>
  <text x="340" y="149" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1e40af">(X = O always satisfies AX = O)</text>

  <!-- Arrow down to fork -->
  <line x1="340" y1="158" x2="340" y2="196" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrH)"/>
  <text x="352" y="182" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Find R(A)</text>

  <!-- Horizontal fork bar -->
  <line x1="170" y1="202" x2="510" y2="202" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Left branch: R(A) = n -->
  <line x1="170" y1="202" x2="170" y2="244" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrH)"/>
  <text x="160" y="222" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">R(A) = n</text>
  <text x="160" y="237" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">(n = no. of unknowns; |A| ≠ 0)</text>

  <rect x="45" y="250" width="250" height="58" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
  <text x="170" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#166534">Unique or trivial solution</text>
  <text x="170" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#15803d">(each unknown equal to zero)</text>

  <!-- Right branch: R(A) < n -->
  <line x1="510" y1="202" x2="510" y2="244" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrHBlue)"/>
  <text x="520" y="222" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb">R(A) &lt; n</text>
  <text x="520" y="237" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">(if square, |A| = 0)</text>

  <rect x="385" y="250" width="250" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="510" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Infinite no. of non-trivial</text>
  <text x="510" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1e40af">solutions (n − r parameters)</text>
</svg>
