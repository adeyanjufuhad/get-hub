<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" width="480" height="310">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="480" height="310" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Cone cross-section triangle ABC -->
  <!-- A = (160, 42), B = (70, 250), C = (250, 250), D = (160, 250) -->
  <polygon points="160,42 70,250 250,250" fill="#eff6ff" stroke="#111827" stroke-width="2"/>

  <!-- Base ellipse hint -->
  <ellipse cx="160" cy="250" rx="90" ry="16" fill="#dbeafe" fill-opacity="0.45" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3"/>

  <!-- Altitude AD -->
  <line x1="160" y1="42" x2="160" y2="250" stroke="#2563eb" stroke-width="2"/>

  <!-- Right-angle marker at D -->
  <polyline points="148,250 148,238 160,238" fill="none" stroke="#2563eb" stroke-width="1.4"/>

  <!-- Semi-vertical angle alpha arc between AB and AD -->
  <path d="M 144.6 77.6 A 39 39 0 0 0 160 81" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="142" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-style="italic" font-weight="700" fill="#dc2626">α</text>

  <!-- Vertex labels -->
  <text x="155" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">A</text>
  <text x="53" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">B</text>
  <text x="257" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">C</text>
  <text x="155" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#111827">D</text>

  <!-- Side labels l, h, r -->
  <text x="98" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-style="italic" font-weight="700" fill="#111827">l</text>
  <text x="167" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-style="italic" font-weight="700" fill="#2563eb">h</text>
  <text x="112" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-style="italic" font-weight="700" fill="#111827">r</text>

  <!-- Right-side formula box -->
  <rect x="284" y="48" width="178" height="214" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="298" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Example 57 (§1.21)</text>
  <line x1="298" y1="82" x2="448" y2="82" stroke="#e2e8f0" stroke-width="1"/>
  <text x="298" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#111827">r = h tan α</text>
  <text x="298" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#111827">l = h sec α</text>
  <line x1="298" y1="145" x2="448" y2="145" stroke="#e2e8f0" stroke-width="1"/>
  <text x="298" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#111827">Total area (with base):</text>
  <text x="298" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#2563eb">A = πr² + πrl</text>
  <text x="298" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#2563eb">  = πh²(tan²α + tan α sec α)</text>
  <text x="298" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#dc2626">At α = π/6, +1% in h</text>
  <text x="298" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#dc2626">⇒ δα ≈ −19.8′</text>
</svg>
