<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310">
  <rect width="760" height="310" rx="10" fill="#fafaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title bar -->
  <text x="380" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">Minors &amp; Cofactor Sign Matrix — (-1)^(r+c)</text>

  <!-- LEFT PANEL: Minor Deletion M_12 -->
  <rect x="24" y="44" width="334" height="244" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="191" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Deleting Row 1 &amp; Column 2 for M₁₂</text>

  <!-- 3x3 determinant bars -->
  <line x1="56" y1="88" x2="56" y2="212" stroke="#111827" stroke-width="2.2"/>
  <line x1="184" y1="88" x2="184" y2="212" stroke="#111827" stroke-width="2.2"/>

  <!-- Highlight deleted row 1 and col 2 -->
  <rect x="61" y="92" width="118" height="34" rx="4" fill="#fee2e2" opacity="0.75"/>
  <rect x="103" y="92" width="36" height="116" rx="4" fill="#fee2e2" opacity="0.75"/>
  <!-- Cross-out lines -->
  <line x1="62" y1="109" x2="178" y2="109" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="121" y1="92" x2="121" y2="208" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,3"/>

  <!-- Highlight surviving minor elements -->
  <rect x="64" y="135" width="32" height="28" rx="4" fill="#dbeafe"/>
  <rect x="145" y="135" width="32" height="28" rx="4" fill="#dbeafe"/>
  <rect x="64" y="175" width="32" height="28" rx="4" fill="#dbeafe"/>
  <rect x="145" y="175" width="32" height="28" rx="4" fill="#dbeafe"/>

  <!-- Entries -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="15" text-anchor="middle">
    <text x="80" y="114" fill="#94a3b8">a₁</text>
    <text x="121" y="114" font-weight="700" fill="#dc2626">b₁</text>
    <text x="161" y="114" fill="#94a3b8">c₁</text>

    <text x="80" y="154" font-weight="700" fill="#1d4ed8">a₂</text>
    <text x="121" y="154" fill="#94a3b8">b₂</text>
    <text x="161" y="154" font-weight="700" fill="#1d4ed8">c₂</text>

    <text x="80" y="194" font-weight="700" fill="#1d4ed8">a₃</text>
    <text x="121" y="194" fill="#94a3b8">b₃</text>
    <text x="161" y="194" font-weight="700" fill="#1d4ed8">c₃</text>
  </g>

  <!-- Arrow to 2x2 Minor -->
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <line x1="196" y1="150" x2="236" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="216" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563eb">M₁₂</text>

  <!-- 2x2 minor determinant -->
  <line x1="250" y1="115" x2="250" y2="188" stroke="#1d4ed8" stroke-width="2.2"/>
  <line x1="336" y1="115" x2="336" y2="188" stroke="#1d4ed8" stroke-width="2.2"/>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1d4ed8">
    <text x="274" y="141">a₂</text>
    <text x="312" y="141">c₂</text>
    <text x="274" y="174">a₃</text>
    <text x="312" y="174">c₃</text>
  </g>

  <!-- Bottom formula in left panel -->
  <rect x="42" y="232" width="298" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="191" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#111827">Cofactor A₁₂ = (-1)^(1+2) M₁₂ = -M₁₂</text>
  <text x="191" y="266" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">= -(a₂c₃ - a₃c₂)</text>

  <!-- RIGHT PANEL: Cofactor Sign Chessboards (3x3 and 4x4) -->
  <rect x="378" y="44" width="358" height="244" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="557" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Cofactor Sign Chessboard: (-1)^(r+c)</text>

  <!-- 3x3 Chessboard -->
  <text x="457" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">Order 3</text>
  <g transform="translate(403, 102)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="37" y="0" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="74" y="0" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <!-- Row 2 -->
    <rect x="0" y="37" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="37" y="37" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="74" y="37" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <!-- Row 3 -->
    <rect x="0" y="74" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="37" y="74" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="74" y="74" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>

    <g font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      <text x="17" y="23" fill="#1d4ed8">+</text><text x="54" y="23" fill="#dc2626">−</text><text x="91" y="23" fill="#1d4ed8">+</text>
      <text x="17" y="60" fill="#dc2626">−</text><text x="54" y="60" fill="#1d4ed8">+</text><text x="91" y="60" fill="#dc2626">−</text>
      <text x="17" y="97" fill="#1d4ed8">+</text><text x="54" y="97" fill="#dc2626">−</text><text x="91" y="97" fill="#1d4ed8">+</text>
    </g>
  </g>

  <!-- 4x4 Chessboard -->
  <text x="641" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">Order 4</text>
  <g transform="translate(566, 102)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="37" y="0" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="74" y="0" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="111" y="0" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <!-- Row 2 -->
    <rect x="0" y="37" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="37" y="37" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="74" y="37" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="111" y="37" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <!-- Row 3 -->
    <rect x="0" y="74" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="37" y="74" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="74" y="74" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="111" y="74" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <!-- Row 4 -->
    <rect x="0" y="111" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="37" y="111" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="74" y="111" width="34" height="34" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="111" y="111" width="34" height="34" rx="4" fill="#dbeafe" stroke="#93c5fd"/>

    <g font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      <text x="17" y="23" fill="#1d4ed8">+</text><text x="54" y="23" fill="#dc2626">−</text><text x="91" y="23" fill="#1d4ed8">+</text><text x="128" y="23" fill="#dc2626">−</text>
      <text x="17" y="60" fill="#dc2626">−</text><text x="54" y="60" fill="#1d4ed8">+</text><text x="91" y="60" fill="#dc2626">−</text><text x="128" y="60" fill="#1d4ed8">+</text>
      <text x="17" y="97" fill="#1d4ed8">+</text><text x="54" y="97" fill="#dc2626">−</text><text x="91" y="97" fill="#1d4ed8">+</text><text x="128" y="97" fill="#dc2626">−</text>
      <text x="17" y="134" fill="#dc2626">−</text><text x="54" y="134" fill="#1d4ed8">+</text><text x="91" y="134" fill="#dc2626">−</text><text x="128" y="134" fill="#1d4ed8">+</text>
    </g>
  </g>

  <!-- Legend -->
  <rect x="403" y="256" width="14" height="14" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="424" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">r + c even (+M)</text>
  <rect x="548" y="256" width="14" height="14" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="569" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">r + c odd (−M)</text>
</svg>
