<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="title-eul desc-eul">
  <title id="title-eul">Decision workflow for Euler's theorem and its first- and second-order deductions</title>
  <desc id="desc-eul">Flowchart showing how to test homogeneity of degree n and choose between Euler's Theorem directly or Deductions I and II for composite functions z = f(u).</desc>
  <defs>
    <marker id="arr-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="400" fill="#fafaf8" rx="8"/>

  <!-- Heading -->
  <text x="28" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#111827">§1.10–1.11 Euler's Theorem &amp; Deductions — Problem-Solving Workflow</text>
  <text x="28" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4b5563">Identify whether the given function is directly homogeneous or a function of a homogeneous expression, then pick the matching identity.</text>

  <!-- Top Step Box -->
  <rect x="170" y="68" width="420" height="58" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="380" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#111827">Step 1: Factor out powers of x (or substitute x → tx, y → ty)</text>
  <text x="380" y="113" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">Can the function itself be written as  xⁿ φ(y/x)  of degree n?</text>

  <!-- Split arrows from Step 1 -->
  <path d="M 275,126 L 275,146 L 195,146 L 195,166" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-flow)"/>
  <path d="M 485,126 L 485,146 L 565,146 L 565,166" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-flow)"/>

  <!-- Branch badges -->
  <rect x="136" y="135" width="118" height="22" rx="11" fill="#dbeafe"/>
  <text x="195" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">YES — Direct z(x, y)</text>

  <rect x="444" y="135" width="242" height="22" rx="11" fill="#fee2e2"/>
  <text x="565" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">NO — Invert to z = f(u) = xⁿ φ(y/x)</text>

  <!-- LEFT BRANCH: Direct Euler -->
  <rect x="28" y="170" width="334" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="193" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Euler's Theorem (First Order)</text>
  <text x="195" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#111827">x (∂z/∂x) + y (∂z/∂y) = n z</text>
  <text x="195" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">3 variables:  x uₓ + y uᵧ + z u_z = n u</text>

  <!-- Arrow down left -->
  <line x1="195" y1="260" x2="195" y2="288" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-flow)"/>

  <!-- Left Second-order box -->
  <rect x="28" y="292" width="334" height="86" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Second-Order Euler Identity (Ex. 25)</text>
  <text x="195" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827">x² zₓₓ + 2xy zₓᵧ + y² zᵧᵧ = n(n − 1) z</text>
  <text x="195" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#4b5563">Note: vanishes identically when n = 0 or n = 1</text>

  <!-- RIGHT BRANCH: Composite z = f(u) -->
  <rect x="398" y="170" width="334" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="565" y="193" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Deduction I (First Order)</text>
  <text x="565" y="218" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#111827">x (∂u/∂x) + y (∂u/∂y) = n · f(u) / f′(u) = g(u)</text>
  <text x="565" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">e.g. u = sin⁻¹(…), tan⁻¹(…), log(…) → f(u) = sin u, tan u, eᵘ</text>

  <!-- Arrow down right -->
  <line x1="565" y1="260" x2="565" y2="288" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-flow)"/>

  <!-- Right Second-order box -->
  <rect x="398" y="292" width="334" height="86" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="565" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Deduction II (Second Order)</text>
  <text x="565" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827">x² uₓₓ + 2xy uₓᵧ + y² uᵧᵧ = g(u) [ g′(u) − 1 ]</text>
  <text x="565" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#4b5563">where g(u) = n · f(u) / f′(u) from Deduction I</text>
</svg>
