<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" role="img" aria-label="Graph of (x^2-9)/(x-3) showing a removable hole at (3,6)">
  <rect width="560" height="250" rx="14" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#141413">Removable Discontinuity: f(x) = (x² - 9)/(x - 3)</text>
  <!-- Axes -->
  <line x1="70" y1="205" x2="500" y2="205" stroke="#141413" stroke-width="1.8"/>
  <line x1="140" y1="45" x2="140" y2="225" stroke="#141413" stroke-width="1.8"/>
  <text x="492" y="222" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#141413">x</text>
  <text x="122" y="54" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#141413">y</text>
  <!-- Dashed guides to (3, 6) -> screen (290, 95) -->
  <line x1="290" y1="205" x2="290" y2="95" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="140" y1="95" x2="290" y2="95" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="285" y="222" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#4B5563">3</text>
  <text x="118" y="99" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#4B5563">6</text>
  <!-- Line y = x + 3 with open hole at (290, 95) -->
  <line x1="90" y1="175" x2="283" y2="98" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
  <line x1="297" y1="92" x2="430" y2="40" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="290" cy="95" r="6" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.5"/>
  <!-- Callout -->
  <text x="310" y="108" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#EA580C">Hole at (3, 6)</text>
  <text x="310" y="124" font-family="system-ui,sans-serif" font-size="11" fill="#4B5563">f(3) undefined, but limit = 6</text>
</svg>
