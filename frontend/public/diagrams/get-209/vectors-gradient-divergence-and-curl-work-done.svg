  <circle cx="70" cy="200" r="3.5" fill="#141413"/>
  <circle cx="450" cy="200" r="3.5" fill="#141413"/>
  <text x="56" y="222" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#141413" text-anchor="start">A</text>
  <text x="458" y="204" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#141413" text-anchor="start">B</text>
  <text x="336" y="56" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#EA580C" text-anchor="start" font-style="italic">F</text>
  <path d="M 120.0 200.0 A 50 50 0 0 0 114.1 176.5" fill="none" stroke="#141413" stroke-width="1.6"/>
