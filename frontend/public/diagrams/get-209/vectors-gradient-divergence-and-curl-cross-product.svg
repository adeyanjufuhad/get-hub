<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 292" role="img" aria-label="Direction of the vector product by the right hand rule">
  <defs>
    <marker id="ah0F766E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
    <marker id="ah1D4ED8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"/></marker>
    <marker id="ahEA580C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker>
  </defs>
  <rect width="520" height="292" rx="14" fill="#FFFFFF"/>
  <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#141413" text-anchor="start">§5.11 (redrawn) — a × b = |a||b| sin θ η</text>
  <line x1="150" y1="230" x2="420" y2="230" stroke="#0F766E" stroke-width="2.6" marker-end="url(#ah0F766E)"/>
  <line x1="150" y1="230" x2="330" y2="110" stroke="#EA580C" stroke-width="2.6" marker-end="url(#ahEA580C)"/>
  <line x1="150" y1="230" x2="150" y2="50" stroke="#1D4ED8" stroke-width="2.6" marker-end="url(#ah1D4ED8)"/>
  <circle cx="150" cy="230" r="3.5" fill="#141413"/>
  <text x="414" y="252" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0F766E" text-anchor="start" font-style="italic">a</text>
  <text x="336" y="104" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#EA580C" text-anchor="start" font-style="italic">b</text>
  <text x="160" y="62" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="start">η  (direction of a × b)</text>
  <path d="M 210.0 230.0 A 60 60 0 0 0 198.5 194.7" fill="none" stroke="#141413" stroke-width="1.6"/>
  <text x="222" y="220" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#141413" text-anchor="start">θ</text>
  <text x="330" y="170" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">right-handed</text>
  <text x="330" y="186" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">system a, b, η</text>
  <text x="20" y="276" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">η is the unit vector perpendicular to both a and b</text>
</svg>
