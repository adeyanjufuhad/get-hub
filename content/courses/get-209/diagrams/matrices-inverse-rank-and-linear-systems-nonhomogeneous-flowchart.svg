<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 370" width="740" height="370">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="740" height="370" rx="10" fill="#fafaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top box -->
  <rect x="195" y="20" width="350" height="54" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <text x="370" y="43" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#111827">System of Non-Homogeneous Linear Equations</text>
  <text x="370" y="63" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563eb">AX = B  (Augmented Matrix C = [A : B])</text>

  <!-- Vertical stem from top -->
  <line x1="370" y1="74" x2="370" y2="112" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="382" y="99" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Find R(A) and R(C)</text>

  <!-- First branch horizontal bar -->
  <line x1="210" y1="118" x2="555" y2="118" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Left branch: R(A) = R(C) -->
  <line x1="210" y1="118" x2="210" y2="152" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="198" y="139" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563eb">R(A) = R(C)</text>

  <rect x="100" y="158" width="220" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="210" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Solution exists</text>
  <text x="210" y="199" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#1e40af">System is consistent</text>

  <!-- Right branch: R(A) != R(C) -->
  <line x1="555" y1="118" x2="555" y2="152" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrRed)"/>
  <text x="567" y="139" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#dc2626">R(A) ≠ R(C)</text>

  <rect x="445" y="158" width="220" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="555" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#991b1b">No solution</text>
  <text x="555" y="199" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b91c1c">System is inconsistent</text>

  <!-- Sub-branches from Consistent -->
  <line x1="210" y1="210" x2="210" y2="248" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="135" y1="248" x2="345" y2="248" stroke="#2563eb" stroke-width="1.8"/>

  <!-- Sub-left: Unique solution -->
  <line x1="135" y1="248" x2="135" y2="288" stroke="#15803d" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="125" y="266" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#15803d">R(A) = R(C) = n</text>
  <text x="125" y="281" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">(n = no. of unknowns)</text>

  <rect x="60" y="294" width="150" height="52" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
  <text x="135" y="317" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#166534">Unique</text>
  <text x="135" y="335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#166534">solution</text>

  <!-- Sub-right: Infinite solutions -->
  <line x1="345" y1="248" x2="345" y2="288" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="355" y="266" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563eb">R(A) = R(C) = r &lt; n</text>
  <text x="355" y="281" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">(n − r arbitrary parameters)</text>

  <rect x="255" y="294" width="180" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="345" y="317" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Infinite no. of</text>
  <text x="345" y="335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1e3a8a">solutions</text>
</svg>
