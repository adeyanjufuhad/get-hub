cap="round"/><text x="154" y="114" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">y = 1 m</text><text x="265" y="190" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F766E" text-anchor="start">sCB = 1.25 − 0.75 = 0.5 m</text><text x="265" y="160" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start">CB = √(1² + 0.75²) = 1.25 m</text><line x1="196" y1="160" x2="196" y2="187" stroke="#0F766E" stroke-width="2.4" stroke-linecap="round"/><polygon points="196,196 200.05,187 191.95,187" fill="#0F766E"/><text x="202" y="194" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0F766E" text-anchor="start">W</text><text x="24" y="262" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">Smooth 2-kg collar on a vertical shaft; spring unstretched at A. Find the speed at C.</text>
