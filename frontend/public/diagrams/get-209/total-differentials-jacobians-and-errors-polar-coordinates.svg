<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="640" height="340" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Subtle grid in plot region -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="120" y1="40" x2="120" y2="280"/>
    <line x1="180" y1="40" x2="180" y2="280"/>
    <line x1="240" y1="40" x2="240" y2="280"/>
    <line x1="300" y1="40" x2="300" y2="280"/>
    <line x1="60" y1="90" x2="350" y2="90"/>
    <line x1="60" y1="150" x2="350" y2="150"/>
    <line x1="60" y1="210" x2="350" y2="210"/>
  </g>

  <!-- Coordinate axes -->
  <line x1="45" y1="270" x2="365" y2="270" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-dark)"/>
  <line x1="80" y1="305" x2="80" y2="32" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-dark)"/>

  <!-- Axis labels -->
  <text x="372" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-style="italic" font-weight="600" fill="#111827">x</text>
  <text x="74" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-style="italic" font-weight="600" fill="#111827">y</text>
  <text x="61" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#111827">O</text>

  <!-- Projections from P(280, 110) -->
  <line x1="280" y1="110" x2="280" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="80" y1="110" x2="280" y2="110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Right-angle symbol at M(280, 270) -->
  <polyline points="268,270 268,258 280,258" fill="none" stroke="#64748b" stroke-width="1.3"/>

  <!-- Triangle highlight -->
  <polygon points="80,270 280,270 280,110" fill="#2563eb" fill-opacity="0.06"/>

  <!-- Radius vector r -->
  <line x1="80" y1="270" x2="275" y2="114" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>

  <!-- Angle arc theta -->
  <path d="M 134 270 A 54 54 0 0 0 122.2 236.2" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="142" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-style="italic" font-weight="600" fill="#dc2626">θ</text>

  <!-- Point P -->
  <circle cx="280" cy="110" r="4.5" fill="#2563eb"/>
  <text x="290" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#111827">P(x, y)</text>
  <text x="290" y="121" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">= (r cos θ, r sin θ)</text>

  <!-- Side labels -->
  <text x="164" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-style="italic" font-weight="700" fill="#2563eb">r</text>
  <text x="155" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#111827">x = r cos θ</text>
  <text x="288" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#111827">y = r sin θ</text>
  <text x="275" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">M</text>

  <!-- Summary formula panel on right -->
  <rect x="405" y="42" width="212" height="252" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="421" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Polar Transformations</text>
  <line x1="421" y1="77" x2="601" y2="77" stroke="#e2e8f0" stroke-width="1"/>

  <text x="421" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#111827">r² = x² + y²</text>
  <text x="421" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#111827">θ = tan⁻¹(y / x)</text>

  <line x1="421" y1="142" x2="601" y2="142" stroke="#e2e8f0" stroke-width="1"/>
  <text x="421" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Partial Derivatives</text>

  <text x="421" y="189" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#2563eb">∂x / ∂r = cos θ</text>
  <text x="421" y="213" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#2563eb">∂y / ∂r = sin θ</text>
  <text x="421" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#dc2626">∂x / ∂θ = −r sin θ</text>
  <text x="421" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#dc2626">∂y / ∂θ = r cos θ</text>
  <text x="421" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">J = ∂(x, y) / ∂(r, θ) = r</text>
</svg>
