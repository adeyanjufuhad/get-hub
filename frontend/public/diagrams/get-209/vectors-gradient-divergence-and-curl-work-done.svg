    <marker id="ahEA580C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker>
  </defs>
  <rect width="540" height="270" rx="14" fill="#FFFFFF"/>
  <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#141413" text-anchor="start">§5.10 (redrawn) — Work done = F · AB</text>
  <line x1="70" y1="200" x2="450" y2="200" stroke="#0F766E" stroke-width="2.6" marker-end="url(#ah0F766E)"/>
  <line x1="70" y1="200" x2="330" y2="60" stroke="#EA580C" stroke-width="2.6" marker-end="url(#ahEA580C)"/>
