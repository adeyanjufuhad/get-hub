<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-label="Projection of a line parallel to VP and inclined at 30 degrees to HP">
  <rect width="600" height="280" rx="14" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#141413">Line PQ Parallel to VP &amp; Inclined at θ = 30° to HP</text>
  <!-- XY Reference Line -->
  <line x1="40" y1="165" x2="560" y2="165" stroke="#141413" stroke-width="2"/>
  <text x="40" y="157" font-family="monospace" font-size="12" font-weight="700" fill="#141413">X</text>
  <text x="548" y="157" font-family="monospace" font-size="12" font-weight="700" fill="#141413">Y</text>
  <text x="485" y="152" font-family="system-ui,sans-serif" font-size="11" fill="#6B7280">VP (Front)</text>
  <text x="485" y="182" font-family="system-ui,sans-serif" font-size="11" fill="#6B7280">HP (Top)</text>
  <!-- Horizontal reference at p' -->
  <line x1="150" y1="130" x2="395" y2="130" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="4 4"/>
  <!-- Projectors -->
  <line x1="150" y1="130" x2="150" y2="220" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="358" y1="60" x2="358" y2="220" stroke="#9CA3AF" stroke-width="1.3" stroke-dasharray="4 4"/>
  <!-- Front view p'q' (True Length L, inclined 30 deg) -->
  <line x1="150" y1="130" x2="358" y2="60" stroke="#EA580C" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="150" cy="130" r="4" fill="#141413"/>
  <circle cx="358" cy="60" r="4" fill="#141413"/>
  <text x="132" y="134" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#141413">p'</text>
  <text x="366" y="64" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#141413">q'</text>
  <!-- Angle arc -->
  <path d="M 210 130 A 60 60 0 0 0 202 112" fill="none" stroke="#EA580C" stroke-width="1.8"/>
  <text x="218" y="124" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#EA580C">θ = 30°</text>
  <text x="215" y="78" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#EA580C">True Length (L)</text>
  <!-- Top view pq (Plan Length = L cos θ) -->
  <line x1="150" y1="220" x2="358" y2="220" stroke="#0F766E" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="150" cy="220" r="4" fill="#141413"/>
  <circle cx="358" cy="220" r="4" fill="#141413"/>
  <text x="135" y="225" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#141413">p</text>
  <text x="366" y="225" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#141413">q</text>
  <text x="195" y="245" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0F766E">Top View (Plan) = L cos θ</text>
  <!-- Dimension cues -->
  <text x="58" y="149" font-family="system-ui,sans-serif" font-size="11" fill="#4B5563">h above HP</text>
  <text x="58" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#4B5563">d in front of VP</text>
</svg>
