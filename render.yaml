services:
  - type: web
    name: get-hub-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://get-hub-lyart.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: INCLUDE_DRAFT_CONTENT
        value: "true"
      - key: ENFORCE_PAID_GATING
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LIBRARY_S3_ENDPOINT
        sync: false
      - key: LIBRARY_S3_REGION
        value: eu-central-1
      - key: LIBRARY_S3_BUCKET
        value: library
      - key: LIBRARY_S3_ACCESS_KEY_ID
        sync: false
      - key: LIBRARY_S3_SECRET_ACCESS_KEY
        sync: false
