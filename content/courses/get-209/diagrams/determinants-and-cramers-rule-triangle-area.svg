<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" height="300">
  <defs>
    <marker id="axisArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="740" height="300" rx="10" fill="#fafaf8" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="370" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">Geometric Application: Area of a Triangle &amp; Collinearity (§4.13)</text>

  <!-- LEFT PANEL: Non-collinear triangle -->
  <rect x="24" y="44" width="388" height="236" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="218" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Triangle Area: Δ = ½ |det| &gt; 0</text>

  <!-- Axes -->
  <line x1="60" y1="226" x2="374" y2="226" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <line x1="84" y1="248" x2="84" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <text x="382" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" fill="#475569">x</text>
  <text x="80" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" fill="#475569">y</text>
  <text x="72" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">O</text>

  <!-- Projection dashed lines -->
  <g stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3">
    <line x1="138" y1="186" x2="138" y2="226"/>
    <line x1="316" y1="198" x2="316" y2="226"/>
    <line x1="234" y1="104" x2="234" y2="226"/>
  </g>

  <!-- Triangle ABC -->
  <polygon points="138,186 316,198 234,104" fill="#dbeafe" fill-opacity="0.65" stroke="#2563eb" stroke-width="2.2"/>
  <text x="228" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Area Δ</text>

  <!-- Vertices -->
  <circle cx="138" cy="186" r="4.5" fill="#dc2626"/>
  <circle cx="316" cy="198" r="4.5" fill="#dc2626"/>
  <circle cx="234" cy="104" r="4.5" fill="#dc2626"/>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">
    <text x="130" y="176" text-anchor="end">A(x₁, y₁)</text>
    <text x="322" y="192" text-anchor="start">B(x₂, y₂)</text>
    <text x="242" y="99" text-anchor="start">C(x₃, y₃)</text>
  </g>

  <!-- Formula caption -->
  <text x="218" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Take absolute value of determinant so area Δ ≥ 0</text>

  <!-- RIGHT PANEL: Collinear points -->
  <rect x="430" y="44" width="286" height="236" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="573" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Collinear Points: Area Δ = 0</text>

  <!-- Axes -->
  <line x1="454" y1="226" x2="692" y2="226" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <line x1="472" y1="248" x2="472" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <text x="698" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" fill="#475569">x</text>
  <text x="468" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" fill="#475569">y</text>

  <!-- Straight line through A, B, C -->
  <line x1="490" y1="205" x2="672" y2="105" stroke="#dc2626" stroke-width="2.2"/>
  <circle cx="514" cy="192" r="4.5" fill="#1d4ed8"/>
  <circle cx="582" cy="154" r="4.5" fill="#1d4ed8"/>
  <circle cx="648" cy="118" r="4.5" fill="#1d4ed8"/>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#111827">
    <text x="522" y="207">A(x₁, y₁)</text>
    <text x="590" y="169">B(x₂, y₂)</text>
    <text x="646" y="108" text-anchor="middle">C(x₃, y₃)</text>
  </g>

  <rect x="456" y="244" width="234" height="26" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="573" y="261" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">det[xᵢ, yᵢ, 1] = 0 ⇔ Collinear</text>
</svg>
