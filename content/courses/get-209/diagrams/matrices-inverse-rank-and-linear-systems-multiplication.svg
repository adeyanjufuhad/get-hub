<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="360" rx="10" fill="#fafaf8" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Matrix Multiplication: Conformability &amp; Row-by-Column Product (H. K. Dass §4.24)</text>

  <!-- TOP HALF: Dimension Compatibility Rule -->
  <g transform="translate(0, 48)">
    <!-- Box A -->
    <rect x="65" y="18" width="130" height="58" rx="8" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="130" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#111827">Matrix A</text>
    <text x="115" y="64" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563eb">m</text>
    <text x="130" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">×</text>
    <text x="145" y="64" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#dc2626">n</text>

    <!-- Multiply symbol -->
    <text x="230" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#334155">·</text>

    <!-- Box B -->
    <rect x="265" y="18" width="130" height="58" rx="8" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="330" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#111827">Matrix B</text>
    <text x="315" y="64" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#dc2626">n</text>
    <text x="330" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">×</text>
    <text x="345" y="64" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563eb">p</text>

    <!-- Equals arrow -->
    <line x1="412" y1="47" x2="472" y2="47" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>
    <text x="442" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">defined</text>

    <!-- Box C = AB -->
    <rect x="490" y="18" width="195" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="587" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">Product C = AB</text>
    <text x="587" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563eb">order m × p</text>

    <!-- Inner dimension connector (n = n) -->
    <path d="M 150 78 L 150 96 L 310 96 L 310 78" fill="none" stroke="#dc2626" stroke-width="1.8"/>
    <rect x="172" y="86" width="116" height="20" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="230" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#dc2626">Must match (n = n)</text>

    <!-- Outer dimension connector (m x p) -->
    <path d="M 110 78 L 110 116 L 587 116 L 587 80" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
    <path d="M 350 78 L 350 116" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3"/>
    <rect x="372" y="106" width="175" height="20" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
    <text x="460" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#1d4ed8">Outer dimensions give m × p</text>
  </g>

  <!-- Divider -->
  <line x1="36" y1="184" x2="724" y2="184" stroke="#cbd5e1" stroke-width="1"/>

  <!-- BOTTOM HALF: Row x Column Inner Product Schematic (Example 4 style) -->
  <g transform="translate(0, 196)">
    <text x="380" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Row-by-Column Entry Rule: cᵢⱼ = Rᵢ · Cⱼ = aᵢ₁b₁ⱼ + aᵢ₂b₂ⱼ + … + aᵢₙbₙⱼ</text>

    <!-- Matrix A (3x3) -->
    <g transform="translate(55, 36)">
      <!-- Highlight Row 2 -->
      <rect x="8" y="34" width="114" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
      <!-- Brackets -->
      <path d="M 14 4 L 4 4 L 4 94 L 14 94" fill="none" stroke="#111827" stroke-width="2"/>
      <path d="M 116 4 L 126 4 L 126 94 L 116 94" fill="none" stroke="#111827" stroke-width="2"/>
      <!-- Entries -->
      <g font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569" text-anchor="middle">
        <text x="27" y="24">a₁₁</text><text x="65" y="24">a₁₂</text><text x="103" y="24">a₁₃</text>
        <text x="27" y="52" font-weight="700" fill="#1d4ed8">a₂₁</text><text x="65" y="52" font-weight="700" fill="#1d4ed8">a₂₂</text><text x="103" y="52" font-weight="700" fill="#1d4ed8">a₂₃</text>
        <text x="27" y="80">a₃₁</text><text x="65" y="80">a₃₂</text><text x="103" y="80">a₃₃</text>
      </g>
      <text x="65" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af">Row R₂ of A (3×3)</text>
    </g>

    <text x="206" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#334155">×</text>

    <!-- Matrix B (3x2) -->
    <g transform="translate(228, 36)">
      <!-- Highlight Column 2 -->
      <rect x="52" y="8" width="36" height="82" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
      <!-- Brackets -->
      <path d="M 14 4 L 4 4 L 4 94 L 14 94" fill="none" stroke="#111827" stroke-width="2"/>
      <path d="M 86 4 L 96 4 L 96 94 L 86 94" fill="none" stroke="#111827" stroke-width="2"/>
      <!-- Entries -->
      <g font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569" text-anchor="middle">
        <text x="30" y="24">b₁₁</text><text x="70" y="24" font-weight="700" fill="#b91c1c">b₁₂</text>
        <text x="30" y="52">b₂₁</text><text x="70" y="52" font-weight="700" fill="#b91c1c">b₂₂</text>
        <text x="30" y="80">b₃₁</text><text x="70" y="80" font-weight="700" fill="#b91c1c">b₃₂</text>
      </g>
      <text x="50" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">Col C₂ of B (3×2)</text>
    </g>

    <text x="348" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#334155">=</text>

    <!-- Matrix C = AB (3x2) -->
    <g transform="translate(370, 36)">
      <!-- Highlight entry c22 -->
      <rect x="52" y="34" width="38" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
      <!-- Brackets -->
      <path d="M 14 4 L 4 4 L 4 94 L 14 94" fill="none" stroke="#111827" stroke-width="2"/>
      <path d="M 88 4 L 98 4 L 98 94 L 88 94" fill="none" stroke="#111827" stroke-width="2"/>
      <!-- Entries -->
      <g font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569" text-anchor="middle">
        <text x="30" y="24">c₁₁</text><text x="71" y="24">c₁₂</text>
        <text x="30" y="52">c₂₁</text><text x="71" y="52" font-weight="700" fill="#92400e">c₂₂</text>
        <text x="30" y="80">c₃₁</text><text x="71" y="80">c₃₂</text>
      </g>
      <text x="51" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#111827">Product AB (3×2)</text>
    </g>

    <!-- Callout box for c22 -->
    <line x1="464" y1="83" x2="500" y2="83" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrowDark)"/>
    <rect x="506" y="46" width="222" height="76" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="617" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400e">Entry c₂₂ = R₂ · C₂</text>
    <text x="617" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#111827">= a₂₁b₁₂ + a₂₂b₂₂ + a₂₃b₃₂</text>
    <text x="617" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">Note: BA is undefined (2 ≠ 3)</text>
  </g>
</svg>
