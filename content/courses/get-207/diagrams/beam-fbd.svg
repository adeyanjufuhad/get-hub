<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="Free-body diagram of a simply supported beam AB of length 6m with a 120N downward load 2m from A">
  <rect width="600" height="240" rx="14" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#141413">Free-Body Diagram: Simply Supported Beam AB</text>
  <!-- Beam body -->
  <rect x="80" y="106" width="440" height="16" rx="4" fill="#141413"/>
  <text x="72" y="96" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#141413">A</text>
  <text x="516" y="96" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#141413">B</text>
  <!-- Downward Point Load 120 N at 2m (1/3 span = 80 + 146.7 = 227) -->
  <line x1="227" y1="46" x2="227" y2="98" stroke="#EA580C" stroke-width="3.2"/>
  <polygon points="227,106 220,93 234,93" fill="#EA580C"/>
  <text x="240" y="64" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#EA580C">F = 120 N</text>
  <!-- Upward Reaction RA at A -->
  <line x1="80" y1="176" x2="80" y2="130" stroke="#0F766E" stroke-width="3"/>
  <polygon points="80,122 73,135 87,135" fill="#0F766E"/>
  <text x="52" y="194" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F766E">R_A</text>
  <!-- Upward Reaction RB at B -->
  <line x1="520" y1="176" x2="520" y2="130" stroke="#0F766E" stroke-width="3"/>
  <polygon points="520,122 513,135 527,135" fill="#0F766E"/>
  <text x="506" y="194" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F766E">R_B</text>
  <!-- Dimension arrows -->
  <line x1="80" y1="212" x2="227" y2="212" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="227" y1="212" x2="520" y2="212" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="80" y1="205" x2="80" y2="219" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="227" y1="205" x2="227" y2="219" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="520" y1="205" x2="520" y2="219" stroke="#6B7280" stroke-width="1.4"/>
  <text x="136" y="230" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#4B5563">2.0 m</text>
  <text x="355" y="230" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#4B5563">4.0 m</text>
</svg>
