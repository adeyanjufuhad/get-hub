nchor="start">s</text><text x="342" y="63" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#141413" text-anchor="end">F cos θ</text><polygon points="380,215 380,175 420,145 460,105 500,125 500,215" fill="#FDE7D7" stroke="#EA580C" stroke-width="2" stroke-linejoin="round"/><polyline points="380,175 420,145 460,105 500,125" fill="none" stroke="#EA580C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="233" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">s₁</text><text x="500" y="233" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">s₂</text><text x="440" y="185" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#EA580C" text-anchor="middle">U₁₋₂ = area</text>
