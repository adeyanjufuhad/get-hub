<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410">
  <rect width="760" height="410" rx="10" fill="#fafaf8" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">Consistency Criteria via Determinants (H. K. Dass §4.16 &amp; §4.17)</text>

  <!-- TOP CARD: §4.16 Homogeneous Equations -->
  <rect x="24" y="44" width="712" height="148" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="42" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563eb">§4.16 Homogeneous System (d₁ = d₂ = d₃ = 0)</text>

  <!-- Root node -->
  <rect x="280" y="56" width="200" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="380" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Homogeneous Equations</text>

  <!-- Branch lines -->
  <line x1="380" y1="86" x2="380" y2="102" stroke="#475569" stroke-width="1.6"/>
  <line x1="205" y1="102" x2="555" y2="102" stroke="#475569" stroke-width="1.6"/>
  <line x1="205" y1="102" x2="205" y2="118" stroke="#475569" stroke-width="1.6"/>
  <line x1="555" y1="102" x2="555" y2="118" stroke="#475569" stroke-width="1.6"/>

  <!-- Left leaf: D = 0 -->
  <rect x="85" y="118" width="240" height="58" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="205" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#15803d">D = 0</text>
  <text x="205" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#166534">Consistent with infinitely many</text>
  <text x="205" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#166534">(nontrivial) solutions</text>

  <!-- Right leaf: D != 0 -->
  <rect x="435" y="118" width="240" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="555" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">D ≠ 0</text>
  <text x="555" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e40af">Consistent with unique solution</text>
  <text x="555" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e40af">x = 0, y = 0, z = 0 (Trivial)</text>

  <!-- BOTTOM CARD: §4.17 Non-Homogeneous System -->
  <rect x="24" y="206" width="712" height="190" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="42" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563eb">§4.17 Non-Homogeneous System (3 Unknowns)</text>

  <!-- Root node -->
  <rect x="275" y="218" width="210" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="380" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Equations with 3 Unknowns</text>

  <!-- Level 1 branches -->
  <line x1="380" y1="248" x2="380" y2="264" stroke="#475569" stroke-width="1.6"/>
  <line x1="154" y1="264" x2="540" y2="264" stroke="#475569" stroke-width="1.6"/>
  <line x1="154" y1="264" x2="154" y2="282" stroke="#475569" stroke-width="1.6"/>
  <line x1="540" y1="264" x2="540" y2="280" stroke="#475569" stroke-width="1.6"/>

  <!-- Left branch: D != 0 -->
  <rect x="44" y="282" width="220" height="92" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="154" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#1d4ed8">D ≠ 0</text>
  <text x="154" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af">Consistent — Unique Solution</text>
  <text x="154" y="348" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">x = D₁/D,  y = D₂/D,  z = D₃/D</text>
  <text x="154" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">(Cramer's Rule)</text>

  <!-- Right branch header: D = 0 -->
  <rect x="498" y="280" width="84" height="24" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="540" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#111827">D = 0</text>

  <!-- Level 2 branches under D = 0 -->
  <line x1="540" y1="304" x2="540" y2="316" stroke="#475569" stroke-width="1.5"/>
  <line x1="416" y1="316" x2="626" y2="316" stroke="#475569" stroke-width="1.5"/>
  <line x1="416" y1="316" x2="416" y2="328" stroke="#475569" stroke-width="1.5"/>
  <line x1="626" y1="316" x2="626" y2="328" stroke="#475569" stroke-width="1.5"/>

  <!-- D1 = D2 = D3 = 0 -->
  <rect x="316" y="328" width="200" height="54" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="416" y="346" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#15803d">D₁ = D₂ = D₃ = 0</text>
  <text x="416" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#166534">Consistent with infinitely</text>
  <text x="416" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#166534">many solutions</text>

  <!-- At least one Di != 0 -->
  <rect x="530" y="328" width="190" height="54" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="625" y="346" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">D₁ or D₂ or D₃ ≠ 0</text>
  <text x="625" y="364" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#991b1b">Inconsistent</text>
  <text x="625" y="376" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#991b1b">(No solution)</text>
</svg>
