<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420">
  <defs>
    <marker id="if-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="820" height="420" fill="#ffffff" rx="8"/>
  <rect x="1" y="1" width="818" height="418" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#111827">
    Exactness Test &amp; Integrating Factor Rules I–V (Dass §3.11–§3.12)
  </text>

  <!-- Step 1: Test Box -->
  <rect x="260" y="44" width="300" height="46" rx="8" fill="#1e293b"/>
  <text x="410" y="63" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">
    For M(x, y) dx + N(x, y) dy = 0, compute:
  </text>
  <text x="410" y="81" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">
    ∂M/∂y   vs.   ∂N/∂x
  </text>

  <!-- Branch Left: Exact -->
  <line x1="260" y1="67" x2="130" y2="67" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="130" y1="67" x2="130" y2="112" stroke="#2563eb" stroke-width="1.8" marker-end="url(#if-arrow)"/>
  <text x="195" y="61" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2563eb">Equal (Exact)</text>

  <rect x="20" y="116" width="220" height="106" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="130" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">§3.11 Direct Solution</text>
  <text x="130" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#111827">∫ M dx  +  ∫ N_free dy = C</text>
  <text x="130" y="182" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">• Integrate M w.r.t. x (y const.)</text>
  <text x="130" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">• Integrate terms of N without x</text>

  <!-- Branch Down/Right: Non-Exact -->
  <line x1="410" y1="90" x2="410" y2="118" stroke="#dc2626" stroke-width="1.8" marker-end="url(#if-arrow)"/>
  <text x="488" y="109" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#dc2626">Not Equal (∂M/∂y ≠ ∂N/∂x) → Find I.F. (§3.12)</text>

  <!-- Five Rules Table Container -->
  <rect x="260" y="122" width="540" height="278" rx="7" fill="#fafaf8" stroke="#cbd5e1" stroke-width="1.4"/>

  <!-- Table Header -->
  <rect x="260" y="122" width="540" height="32" rx="7" fill="#f1f5f9"/>
  <line x1="260" y1="154" x2="800" y2="154" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="295" y="143" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">Rule</text>
  <text x="475" y="143" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">Recognisable Condition on M dx + N dy = 0</text>
  <text x="712" y="143" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">Integrating Factor (I.F.)</text>

  <!-- Vertical dividers -->
  <line x1="330" y1="122" x2="330" y2="400" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="624" y1="122" x2="624" y2="400" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 1: Rule I -->
  <text x="295" y="182" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563eb">Rule I</text>
  <text x="342" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#111827">(∂M/∂y − ∂N/∂x) / N  =  f(x)</text>
  <text x="342" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">(function of x alone — Ex. 25)</text>
  <text x="712" y="183" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">e^( ∫ f(x) dx )</text>
  <line x1="260" y1="204" x2="800" y2="204" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 2: Rule II -->
  <text x="295" y="232" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563eb">Rule II</text>
  <text x="342" y="227" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#111827">(∂N/∂x − ∂M/∂y) / M  =  f(y)</text>
  <text x="342" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">(function of y alone — Ex. 26)</text>
  <text x="712" y="233" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">e^( ∫ f(y) dy )</text>
  <line x1="260" y1="254" x2="800" y2="254" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 3: Rule III -->
  <text x="295" y="282" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563eb">Rule III</text>
  <text x="342" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#111827">M = y f₁(xy),  N = x f₂(xy)</text>
  <text x="342" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">with Mx − Ny ≠ 0  (Ex. 27)</text>
  <text x="712" y="283" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">1 / (Mx − Ny)</text>
  <line x1="260" y1="304" x2="800" y2="304" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 4: Rule IV -->
  <text x="295" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563eb">Rule IV</text>
  <text x="342" y="327" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#111827">xᵐyⁿ(ay dx + bx dy) + xᵐ'yⁿ'(a'y dx + b'x dy) = 0</text>
  <text x="342" y="343" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Solve (m+h+1)/a = (n+k+1)/b  (Ex. 28–29)</text>
  <text x="712" y="333" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">xʰ yᵏ</text>
  <line x1="260" y1="354" x2="800" y2="354" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 5: Rule V -->
  <text x="295" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563eb">Rule V</text>
  <text x="342" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#111827">M dx + N dy = 0 is homogeneous</text>
  <text x="342" y="391" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">with Mx + Ny ≠ 0  (Ex. 30)</text>
  <text x="712" y="381" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">1 / (Mx + Ny)</text>

  <!-- Loop-back arrow from Rules back to Direct Solution -->
  <rect x="20" y="254" width="220" height="146" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="130" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">After Finding I.F.:</text>
  <text x="130" y="302" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e293b">1. Multiply the entire ODE</text>
  <text x="130" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e293b">   by the I.F.</text>
  <text x="130" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e293b">2. Confirm the new equation</text>
  <text x="130" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e293b">   is exact (∂M₁/∂y = ∂N₁/∂x).</text>
  <text x="130" y="378" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">3. Integrate via §3.11!</text>
  <line x1="130" y1="254" x2="130" y2="226" stroke="#dc2626" stroke-width="1.8" marker-end="url(#if-arrow)"/>
</svg>
