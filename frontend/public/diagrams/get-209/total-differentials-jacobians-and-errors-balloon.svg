<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="460" height="320" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Balloon outline: top hemisphere + cylinder + bottom hemisphere -->
  <!-- Center x = 155, radius = 65, cylinder top y = 95, cylinder bottom y = 225 -->
  <path d="M 90 95 A 65 65 0 0 1 220 95 L 220 225 A 65 65 0 0 1 90 225 Z" fill="#eff6ff" stroke="#111827" stroke-width="2"/>

  <!-- Horizontal seam lines between cylinder and hemispheres -->
  <line x1="90" y1="95" x2="220" y2="95" stroke="#111827" stroke-width="1.5"/>
  <line x1="90" y1="225" x2="220" y2="225" stroke="#111827" stroke-width="1.5"/>

  <!-- Subtle 3D elliptical depth arcs -->
  <path d="M 90 95 Q 155 111 220 95" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 90 225 Q 155 241 220 225" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Centerline -->
  <line x1="155" y1="24" x2="155" y2="296" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- Radius dimension arrow (r = 1.5 m) -->
  <line x1="94" y1="130" x2="151" y2="130" stroke="#dc2626" stroke-width="1.8" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="98" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#dc2626">r = 1.5 m</text>

  <!-- Height dimension arrow (h = 4 m) -->
  <line x1="176" y1="99" x2="176" y2="221" stroke="#2563eb" stroke-width="1.8" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="183" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#2563eb">h = 4 m</text>

  <!-- Annotations on the right -->
  <rect x="252" y="55" width="188" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="266" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Example 54 (§1.21)</text>
  <line x1="266" y1="89" x2="426" y2="89" stroke="#e2e8f0" stroke-width="1"/>
  <text x="266" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#111827">Cylinder + 2 hemispheres:</text>
  <text x="266" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#111827">V = πr²h + (4/3)πr³</text>
  <line x1="266" y1="152" x2="426" y2="152" stroke="#e2e8f0" stroke-width="1"/>
  <text x="266" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">r = 1.5 m,  δr = 0.01 m</text>
  <text x="266" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#334155">h = 4 m,    δh = 0.05 m</text>
  <text x="266" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#dc2626">100(δV / V) ≈ 2.389%</text>
  <text x="266" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">Hemispherical caps (top &amp; bottom)</text>
</svg>
