<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="title-geo desc-geo">
  <title id="title-geo">Geometric interpretation of partial derivatives on a surface z = f(x, y)</title>
  <desc id="desc-geo">A 3D surface z = f(x, y) intersected by the plane y = y0 giving tangent slope dz/dx and by the plane x = x0 giving tangent slope dz/dy at point P(x0, y0, z0).</desc>

  <!-- Background -->
  <rect x="0" y="0" width="760" height="440" fill="#fafaf8" rx="8"/>

  <!-- Title bar -->
  <text x="28" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#111827">Geometric Interpretation of Partial Derivatives on z = f(x, y)</text>
  <text x="28" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#4b5563">Holding one variable constant slices the surface with a vertical plane; the partial derivative is the tangent slope of that trace.</text>

  <!-- 3D Coordinate Axes (Origin at 225, 315) -->
  <!-- z-axis (up) -->
  <line x1="225" y1="315" x2="225" y2="86" stroke="#111827" stroke-width="1.8"/>
  <polygon points="225,76 220,89 230,89" fill="#111827"/>
  <text x="206" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#111827">z</text>

  <!-- x-axis (down-left) -->
  <line x1="225" y1="315" x2="88" y2="392" stroke="#111827" stroke-width="1.8"/>
  <polygon points="80,396 93,395 88,386" fill="#111827"/>
  <text x="64" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#111827">x</text>

  <!-- y-axis (right) -->
  <line x1="225" y1="315" x2="496" y2="315" stroke="#111827" stroke-width="1.8"/>
  <polygon points="506,315 493,310 493,320" fill="#111827"/>
  <text x="514" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#111827">y</text>

  <text x="208" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#374151">O</text>

  <!-- Vertical slicing plane y = y0 (parallel to xz-plane) -->
  <polygon points="402,292 254,375 254,162 402,94" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="366" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563eb">Plane y = y₀</text>

  <!-- Vertical slicing plane x = x0 (parallel to yz-plane) -->
  <polygon points="154,355 452,355 452,154 154,154" fill="#dc2626" fill-opacity="0.06" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="380" y="346" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626">Plane x = x₀</text>

  <!-- XY-plane projection lines for (x0, y0) -->
  <line x1="154" y1="355" x2="294" y2="355" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="365" y1="315" x2="294" y2="355" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3"/>
  <circle cx="294" cy="355" r="3.5" fill="#334155"/>
  <text x="272" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Q(x₀, y₀, 0)</text>
  <text x="134" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-style="italic" fill="#374151">x₀</text>
  <text x="362" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-style="italic" fill="#374151">y₀</text>

  <!-- Surface patch z = f(x, y) -->
  <path d="M 168,236 Q 280,148 442,172 Q 474,218 422,272 Q 308,216 164,292 Q 144,262 168,236 Z"
        fill="#bfdbfe" fill-opacity="0.48" stroke="#334155" stroke-width="1.6"/>
  <text x="434" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" font-style="italic" fill="#1e293b">z = f(x, y)</text>

  <!-- Vertical height line from Q(294,355) to P(294,202) -->
  <line x1="294" y1="355" x2="294" y2="202" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Trace curve C1: y = y0 (blue) passing through P(294, 202) -->
  <path d="M 380,162 Q 338,175 294,202 Q 250,230 218,274"
        fill="none" stroke="#2563eb" stroke-width="2.8"/>

  <!-- Trace curve C2: x = x0 (red) passing through P(294, 202) -->
  <path d="M 182,248 Q 240,205 294,202 Q 360,199 426,234"
        fill="none" stroke="#dc2626" stroke-width="2.8"/>

  <!-- Tangent line T1 along y = y0 (blue) -->
  <line x1="356" y1="164" x2="220" y2="246" stroke="#1d4ed8" stroke-width="2.2"/>
  <polygon points="214,250 227,248 222,240" fill="#1d4ed8"/>
  <text x="90" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Tangent T₁</text>
  <text x="72" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2563eb">(y held constant)</text>

  <!-- Tangent line T2 along x = x0 (red) -->
  <line x1="230" y1="206" x2="394" y2="196" stroke="#b91c1c" stroke-width="2.2"/>
  <polygon points="402,195.5 390,191 390.5,201" fill="#b91c1c"/>
  <text x="406" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Tangent T₂</text>
  <text x="406" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#dc2626">(x held constant)</text>

  <!-- Point P(x0, y0, z0) -->
  <circle cx="294" cy="202" r="5" fill="#111827" stroke="#ffffff" stroke-width="1.8"/>
  <rect x="242" y="160" width="90" height="22" rx="4" fill="#ffffff" fill-opacity="0.88"/>
  <text x="287" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#111827">P(x₀, y₀, z₀)</text>

  <!-- Right-hand legend / formula callout box -->
  <rect x="522" y="90" width="218" height="206" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="538" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#111827">At P(x₀, y₀, z₀):</text>

  <!-- Blue legend -->
  <line x1="538" y1="140" x2="564" y2="140" stroke="#2563eb" stroke-width="3"/>
  <text x="572" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb">∂z / ∂x = fₓ(x₀, y₀)</text>
  <text x="538" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#374151">Slope of trace curve C₁ in</text>
  <text x="538" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#374151">the plane y = y₀ (y constant).</text>

  <line x1="538" y1="196" x2="724" y2="196" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Red legend -->
  <line x1="538" y1="218" x2="564" y2="218" stroke="#dc2626" stroke-width="3"/>
  <text x="572" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#dc2626">∂z / ∂y = fᵧ(x₀, y₀)</text>
  <text x="538" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#374151">Slope of trace curve C₂ in</text>
  <text x="538" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#374151">the plane x = x₀ (x constant).</text>

  <!-- Bottom note -->
  <text x="538" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#64748b">Monge notation: p = ∂z/∂x, q = ∂z/∂y</text>
</svg>
