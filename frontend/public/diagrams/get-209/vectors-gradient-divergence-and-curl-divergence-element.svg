  <text x="20" y="296" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Net outflow per unit volume = ∂V_x/∂x + ∂V_y/∂y + ∂V_z/∂z = div V</text>
