  </defs>
  <rect width="600" height="274" rx="14" fill="#FFFFFF"/>
  <text x="20" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#141413" text-anchor="start">§5.27 (redrawn) — ∇φ is normal to the level surface φ = c</text>
  <path d="M 70 210 Q 250 130 480 190" fill="none" stroke="#0F766E" stroke-width="2.6"/>
  <path d="M 70 150 Q 250 70 480 130" fill="none" stroke="#EA580C" stroke-width="2.6"/>
  <text x="484" y="194" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start">φ = c</text>
  <text x="484" y="134" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#EA580C" text-anchor="start">φ + dφ</text>
  <circle cx="250" cy="164" r="3.5" fill="#141413"/>
  <circle cx="290" cy="106" r="3.5" fill="#141413"/>
  <line x1="250" y1="164" x2="276" y2="90" stroke="#1D4ED8" stroke-width="2.6" marker-end="url(#ah1D4ED8)"/>
  <line x1="250" y1="164" x2="320" y2="172" stroke="#141413" stroke-width="2.2" marker-end="url(#ah141413)"/>
  <text x="228" y="184" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#141413" text-anchor="start">P</text>
  <text x="298" y="102" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#141413" text-anchor="start">R</text>
  <text x="220" y="76" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">N (unit normal)</text>
  <text x="326" y="190" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#141413" text-anchor="start">δr (tangent)</text>
  <text x="20" y="258" font-family="system-ui,sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">∇φ · dr = dφ = 0 along the surface ⇒ ∇φ ⊥ surface;  |∇φ| = ∂φ/∂n</text>
