<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-label="Jump discontinuity where left-hand limit does not equal right-hand limit">
  <rect width="560" height="240" rx="14" fill="#FFFFFF"/>
  <text x="24" y="28" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#141413">Jump Discontinuity: Left Limit ≠ Right Limit</text>
  <!-- Axes -->
  <line x1="65" y1="196" x2="495" y2="196" stroke="#141413" stroke-width="1.8"/>
  <line x1="130" y1="45" x2="130" y2="216" stroke="#141413" stroke-width="1.8"/>
  <line x1="280" y1="196" x2="280" y2="62" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="275" y="214" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#141413">c</text>
  <!-- Left branch approaching L1 -->
  <path d="M 90 175 Q 190 160 274 146" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="280" cy="145" r="5.5" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5"/>
  <text x="155" y="142" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0F766E">x → c⁻ approaches L₁</text>
  <!-- Right branch approaching L2 -->
  <path d="M 286 84 Q 370 74 460 66" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="280" cy="84" r="5.5" fill="#EA580C"/>
  <text x="302" y="102" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#EA580C">x → c⁺ approaches L₂</text>
  <text x="302" y="120" font-family="system-ui,sans-serif" font-size="11" fill="#4B5563">Since L₁ ≠ L₂, limit at c does not exist</text>
</svg>
