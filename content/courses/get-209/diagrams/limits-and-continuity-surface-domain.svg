<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="560" height="320" fill="#ffffff"/>

  <!-- 3D Coordinate Axes (origin at 190, 222) -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <!-- z-axis upward -->
    <line x1="190" y1="222" x2="190" y2="28"/>
    <path d="M186 36 L190 27 L194 36" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- y-axis right -->
    <line x1="190" y1="222" x2="495" y2="222"/>
    <path d="M487 218 L496 222 L487 226" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- x-axis forward-left -->
    <line x1="190" y1="222" x2="74" y2="290"/>
    <path d="M83 290 L73 291 L79 283" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Axis Labels -->
  <text x="190" y="19" text-anchor="middle" font-size="14" font-style="italic" font-weight="700" fill="#111827">z</text>
  <text x="506" y="227" font-size="14" font-style="italic" font-weight="700" fill="#111827">y</text>
  <text x="61" y="299" font-size="14" font-style="italic" font-weight="700" fill="#111827">x</text>
  <text x="174" y="218" font-size="13" fill="#475569">O</text>

  <!-- Domain area A in the xy-plane -->
  <path d="M 192 256 C 228 232, 342 230, 390 248 C 424 262, 392 292, 314 298 C 242 302, 166 280, 192 256 Z"
        fill="#e2e8f0" fill-opacity="0.72" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="296" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Domain A in xy-plane</text>

  <!-- Vertical projection lines from boundary of A to surface -->
  <line x1="192" y1="256" x2="192" y2="112" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="398" y1="262" x2="398" y2="118" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Surface z = f(x, y) -->
  <path d="M 186 112 C 232 62, 345 58, 404 94 C 428 112, 396 150, 318 158 C 244 164, 164 140, 186 112 Z"
        fill="#dbeafe" fill-opacity="0.82" stroke="#2563eb" stroke-width="2.2"/>
  <!-- Subtle mesh curves on surface -->
  <path d="M 225 84 Q 305 110 385 112" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity="0.45"/>
  <path d="M 262 154 Q 295 104 335 72" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity="0.45"/>

  <!-- Point (x, y, 0) in A and corresponding point P(x, y, z) on surface -->
  <line x1="296" y1="262" x2="296" y2="112" stroke="#dc2626" stroke-width="1.9" stroke-dasharray="4 3"/>
  <circle cx="296" cy="262" r="4" fill="#111827"/>
  <circle cx="296" cy="112" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.4"/>

  <!-- Height label z = f(x, y) -->
  <text x="307" y="196" font-size="12.5" font-weight="600" fill="#dc2626">height z = f(x, y)</text>

  <!-- Point Labels -->
  <text x="308" y="266" font-size="12.5" fill="#111827">(x, y, 0)</text>
  <text x="309" y="106" font-size="13" font-weight="700" fill="#111827">P(x, y, z)</text>

  <!-- Surface label -->
  <text x="418" y="74" font-size="13.5" font-weight="700" fill="#1d4ed8">Surface z = f(x, y)</text>
  <line x1="414" y1="77" x2="380" y2="92" stroke="#2563eb" stroke-width="1.3"/>
</svg>
