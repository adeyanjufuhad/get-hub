<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="340" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 3D Coordinate Axes -->
  <!-- Z axis -->
  <line x1="150" y1="245" x2="150" y2="34" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-dark)"/>
  <!-- X axis -->
  <line x1="150" y1="245" x2="495" y2="245" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-dark)"/>
  <!-- Y axis -->
  <line x1="150" y1="245" x2="55" y2="308" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-dark)"/>

  <text x="145" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">Z</text>
  <text x="504" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">X</text>
  <text x="38" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">Y</text>
  <text x="155" y="263" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#111827">O</text>

  <!-- Vertical plane y = k parallel to XZ-plane -->
  <polygon points="122,265 415,265 415,85 122,85" fill="#2563eb" fill-opacity="0.06" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="330" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569">Plane y = k</text>
  <text x="322" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">(parallel to XZ-plane)</text>

  <!-- Surface patch S: z = f(x, y) -->
  <path d="M 195 190 Q 260 115 360 138 L 430 98 Q 335 72 260 142 Z" fill="#dbeafe" fill-opacity="0.55" stroke="#2563eb" stroke-width="1.6"/>
  <text x="388" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">Surface S: z = f(x, y)</text>

  <!-- Intersection curve APB on the plane y = k -->
  <path d="M 195 190 Q 260 115 360 138" fill="none" stroke="#1d4ed8" stroke-width="2.6"/>

  <!-- Point P on curve APB -->
  <circle cx="268" cy="142" r="4.5" fill="#dc2626"/>
  <!-- Tangent line to curve APB at P -->
  <line x1="210" y1="166" x2="335" y2="115" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Labels A, P, B -->
  <text x="182" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">A</text>
  <text x="366" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">B</text>
  <text x="242" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#111827">P(x, k, z)</text>

  <!-- Vertical drop line to y = k base -->
  <line x1="268" y1="142" x2="268" y2="265" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="268" cy="265" r="2.5" fill="#64748b"/>
  <text x="274" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">(x, k, 0)</text>

  <!-- Slope annotation -->
  <rect x="200" y="284" width="335" height="40" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="214" y="309" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#991b1b">Slope of tangent to curve APB at P = ∂z / ∂x</text>
</svg>
