<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="title-pol desc-pol">
  <title id="title-pol">Comparison of (dr/dx) with theta constant versus (dr/dx) with y constant</title>
  <desc id="desc-pol">Two geometric panels in polar coordinates x = r cos theta, y = r sin theta showing why (dr/dx)_theta = sec theta while (dr/dx)_y = cos theta.</desc>
  <defs>
    <marker id="arr-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111827"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="390" fill="#fafaf8" rx="8"/>

  <!-- Main Heading -->
  <text x="24" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#111827">§1.9 Why the Held Variable Matters: (∂r/∂x)_θ ≠ (∂r/∂x)_y</text>
  <text x="24" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4b5563">For x = r cos θ, y = r sin θ, increasing x by δx moves P along two completely different paths depending on which coordinate is frozen.</text>

  <!-- LEFT PANEL: theta held constant -->
  <rect x="20" y="66" width="350" height="304" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#2563eb">(i) Keeping θ constant:  r = x sec θ</text>

  <!-- Axes for left panel: Origin O(64, 290) -->
  <line x1="64" y1="290" x2="342" y2="290" stroke="#111827" stroke-width="1.5" marker-end="url(#arr-k)"/>
  <line x1="64" y1="290" x2="64" y2="112" stroke="#111827" stroke-width="1.5" marker-end="url(#arr-k)"/>
  <text x="348" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="600" fill="#111827">x</text>
  <text x="52" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="600" fill="#111827">y</text>
  <text x="48" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151">O</text>

  <!-- Ray at theta = 32 deg from O(64,290) -->
  <!-- P at r=160 -> dx=135.7, dy=84.8 => P=(200, 205) -->
  <!-- Q at r=245 -> dx=207.8, dy=129.8 => Q=(272, 160) -->
  <line x1="64" y1="290" x2="310" y2="136" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,4"/>
  <!-- Segment OP (r) -->
  <line x1="64" y1="290" x2="200" y2="205" stroke="#111827" stroke-width="2"/>
  <text x="122" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#111827">r</text>

  <!-- Angle arc theta -->
  <path d="M 106,290 A 42,42 0 0 0 100,268" fill="none" stroke="#111827" stroke-width="1.3"/>
  <text x="111" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-style="italic" fill="#111827">θ</text>

  <!-- Right triangle P-M-Q -->
  <!-- M = (272, 205) -->
  <line x1="200" y1="205" x2="272" y2="205" stroke="#111827" stroke-width="1.8"/>
  <line x1="272" y1="205" x2="272" y2="160" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3"/>
  <rect x="263" y="196" width="9" height="9" fill="none" stroke="#64748b" stroke-width="1.1"/>
  <!-- Hypotenuse PQ = dr (blue) -->
  <line x1="200" y1="205" x2="272" y2="160" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-b)"/>

  <!-- Vertical drop lines to x-axis -->
  <line x1="200" y1="205" x2="200" y2="290" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="272" y1="205" x2="272" y2="290" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Points P and Q -->
  <circle cx="200" cy="205" r="4" fill="#111827"/>
  <text x="184" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#111827">P</text>
  <circle cx="272" cy="160" r="4" fill="#2563eb"/>
  <text x="278" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb">Q</text>

  <!-- Triangle labels -->
  <text x="228" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#111827">δx</text>
  <text x="218" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#2563eb">δr</text>
  <text x="234" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-style="italic" fill="#475569">θ</text>
  <text x="195" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">x</text>
  <text x="260" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">x + δx</text>

  <!-- Formula box inside left panel -->
  <rect x="38" y="318" width="314" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="195" y="341" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">δr = δx · sec θ   ⇒   (∂r/∂x)_θ = sec θ</text>

  <!-- RIGHT PANEL: y held constant -->
  <rect x="390" y="66" width="350" height="304" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="406" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#dc2626">(ii) Keeping y constant:  r² = x² + y²</text>

  <!-- Axes for right panel: Origin O(434, 290) -->
  <line x1="434" y1="290" x2="712" y2="290" stroke="#111827" stroke-width="1.5" marker-end="url(#arr-k)"/>
  <line x1="434" y1="290" x2="434" y2="112" stroke="#111827" stroke-width="1.5" marker-end="url(#arr-k)"/>
  <text x="718" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="600" fill="#111827">x</text>
  <text x="422" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="600" fill="#111827">y</text>
  <text x="418" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151">O</text>

  <!-- Constant y line at y = 185 -->
  <line x1="434" y1="185" x2="706" y2="185" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="646" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#dc2626">y = const</text>

  <!-- P = (578, 185): dx = 144, dy = 105 => r = 178.2, theta = 36.1 deg -->
  <!-- Q' = (662, 185): horizontal move dx = 84 -->
  <!-- Radius OP -->
  <line x1="434" y1="290" x2="578" y2="185" stroke="#111827" stroke-width="2"/>
  <text x="494" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#111827">r</text>

  <!-- Radius OQ' = r + dr -->
  <!-- Length OQ' = sqrt(228^2 + 105^2) = 251.0; arc of radius r=178.2 intersects OQ' at: -->
  <!-- 178.2/251.0 = 0.710 => S = (434 + 0.710*228, 290 - 0.710*105) = (596, 215.5) -->
  <line x1="434" y1="290" x2="596" y2="215.5" stroke="#64748b" stroke-width="1.7"/>
  <!-- Highlighted radial increment SQ' = dr (red) -->
  <line x1="596" y1="215.5" x2="662" y2="185" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-r)"/>

  <!-- Circular arc of radius r from P(578,185) to S(596,215.5) -->
  <path d="M 578,185 A 178.2,178.2 0 0 1 596,215.5" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Horizontal step PQ' = dx -->
  <line x1="578" y1="185" x2="662" y2="185" stroke="#111827" stroke-width="2.2"/>

  <!-- Angle arc theta -->
  <path d="M 476,290 A 42,42 0 0 0 468,265" fill="none" stroke="#111827" stroke-width="1.3"/>
  <text x="480" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-style="italic" fill="#111827">θ</text>

  <!-- Drop lines to x-axis -->
  <line x1="578" y1="185" x2="578" y2="290" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="662" y1="185" x2="662" y2="290" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Points P, S, Q' -->
  <circle cx="578" cy="185" r="4" fill="#111827"/>
  <text x="568" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#111827">P</text>
  <circle cx="662" cy="185" r="4" fill="#dc2626"/>
  <text x="668" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#dc2626">Q′</text>
  <circle cx="596" cy="215.5" r="3" fill="#64748b"/>
  <text x="588" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">S</text>

  <!-- Increment labels -->
  <text x="612" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#111827">δx</text>
  <text x="630" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#dc2626">δr</text>
  <text x="573" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">x</text>
  <text x="646" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">x + δx</text>

  <!-- Formula box inside right panel -->
  <rect x="408" y="318" width="314" height="38" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="565" y="341" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">δr ≈ δx · cos θ   ⇒   (∂r/∂x)_y = cos θ</text>
</svg>
