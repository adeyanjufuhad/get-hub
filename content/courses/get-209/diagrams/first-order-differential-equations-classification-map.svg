<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="820" height="430" fill="#ffffff" rx="8"/>
  <rect x="1" y="1" width="818" height="428" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#111827">
    Classification &amp; Solution Strategy for First-Order, First-Degree ODEs (Dass §3.5–§3.12)
  </text>

  <!-- Top Entry Node -->
  <rect x="235" y="44" width="350" height="44" rx="8" fill="#1e293b"/>
  <text x="410" y="63" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
    Given ODE:  dy/dx = F(x, y)   or   M(x, y) dx + N(x, y) dy = 0
  </text>
  <text x="410" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
    Check the four primary families in order of increasing algebra
  </text>

  <!-- Branch trunk lines -->
  <line x1="410" y1="88" x2="410" y2="108" stroke="#475569" stroke-width="1.6"/>
  <line x1="108" y1="108" x2="712" y2="108" stroke="#475569" stroke-width="1.6"/>
  <line x1="108" y1="108" x2="108" y2="128" stroke="#475569" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <line x1="309" y1="108" x2="309" y2="128" stroke="#475569" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <line x1="511" y1="108" x2="511" y2="128" stroke="#475569" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
  <line x1="712" y1="108" x2="712" y2="128" stroke="#475569" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

  <!-- Column 1: Variables Separable (§3.6) -->
  <rect x="20" y="132" width="176" height="118" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="108" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">1. Separable (§3.6)</text>
  <text x="108" y="173" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#111827">f(y) dy = φ(x) dx</text>
  <text x="108" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Integrate both sides directly:</text>
  <text x="108" y="213" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e3a8a">∫ f(y) dy = ∫ φ(x) dx + C</text>
  <text x="108" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Direct or via z = ax + by + c</text>

  <!-- Sub-box 1 -->
  <line x1="108" y1="250" x2="108" y2="274" stroke="#475569" stroke-width="1.4" marker-end="url(#flow-arrow)"/>
  <rect x="20" y="278" width="176" height="130" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="108" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">Reducible to Separable</text>
  <text x="108" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">• dy/dx = f(ax + by + c)</text>
  <text x="108" y="335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">Put z = ax + by + c</text>
  <text x="108" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">• Product xy terms</text>
  <text x="108" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">Put v = xy (Ex. 3)</text>
  <text x="108" y="396" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">• Componendo-dividendo (Ex. 5)</text>

  <!-- Column 2: Homogeneous (§3.7–3.8) -->
  <rect x="221" y="132" width="176" height="118" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="309" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">2. Homogeneous (§3.7)</text>
  <text x="309" y="173" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#111827">dy/dx = f(x, y) / φ(x, y)</text>
  <text x="309" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Every term same degree n</text>
  <text x="309" y="213" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e3a8a">Put y = vx, y' = v + x v'</text>
  <text x="309" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Separates into v and x</text>

  <!-- Sub-box 2 -->
  <line x1="309" y1="250" x2="309" y2="274" stroke="#475569" stroke-width="1.4" marker-end="url(#flow-arrow)"/>
  <rect x="221" y="278" width="176" height="130" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="309" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">Reducible (§3.8)</text>
  <text x="309" y="317" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#111827">y' = (ax+by+c)/(Ax+By+C)</text>
  <text x="309" y="339" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#2563eb">Case I (a/A ≠ b/B):</text>
  <text x="309" y="355" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">Shift x = X + h, y = Y + k</text>
  <text x="309" y="378" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">Case II (a/A = b/B):</text>
  <text x="309" y="394" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">Put z = ax + by (separable)</text>

  <!-- Column 3: Linear & Bernoulli (§3.9–3.10) -->
  <rect x="423" y="132" width="176" height="118" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="511" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">3. Linear (§3.9)</text>
  <text x="511" y="173" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#111827">dy/dx + P(x) y = Q(x)</text>
  <text x="511" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e3a8a">I.F. = e^(∫ P dx)</text>
  <text x="511" y="214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">y(I.F.) = ∫ Q(I.F.) dx + C</text>
  <text x="511" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Or linear in x: dx/dy + P(y)x = Q(y)</text>

  <!-- Sub-box 3 -->
  <line x1="511" y1="250" x2="511" y2="274" stroke="#475569" stroke-width="1.4" marker-end="url(#flow-arrow)"/>
  <rect x="423" y="278" width="176" height="130" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="511" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">Bernoulli (§3.10)</text>
  <text x="511" y="317" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#111827">dy/dx + P y = Q yⁿ</text>
  <text x="511" y="338" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Divide by yⁿ, then put</text>
  <text x="511" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2563eb">z = y^(1 − n)</text>
  <text x="511" y="378" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">Also f'(y) y' + P f(y) = Q</text>
  <text x="511" y="395" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Put z = f(y) (Ex. 14–16)</text>

  <!-- Column 4: Exact & Reducible to Exact (§3.11–3.12) -->
  <rect x="624" y="132" width="176" height="118" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="712" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">4. Exact (§3.11)</text>
  <text x="712" y="173" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#111827">M dx + N dy = 0</text>
  <text x="712" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#991b1b">Test: ∂M/∂y = ∂N/∂x</text>
  <text x="712" y="214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" fill="#334155">∫ M dx + ∫ (N free of x) dy = C</text>
  <text x="712" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">(hold y constant in ∫ M dx)</text>

  <!-- Sub-box 4 -->
  <line x1="712" y1="250" x2="712" y2="274" stroke="#475569" stroke-width="1.4" marker-end="url(#flow-arrow)"/>
  <rect x="624" y="278" width="176" height="130" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="712" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">Reducible to Exact (§3.12)</text>
  <text x="712" y="317" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" fill="#334155">If ∂M/∂y ≠ ∂N/∂x, find I.F.:</text>
  <text x="712" y="336" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e293b">Rule I: f(x)  |  Rule II: f(y)</text>
  <text x="712" y="354" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e293b">Rule III: 1/(Mx − Ny)</text>
  <text x="712" y="372" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e293b">Rule IV: xʰ yᵏ</text>
  <text x="712" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e293b">Rule V: 1/(Mx + Ny) (homog.)</text>
</svg>
