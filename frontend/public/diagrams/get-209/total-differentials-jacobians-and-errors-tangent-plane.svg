<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="600" height="350" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 3D Coordinate Axes -->
  <line x1="130" y1="265" x2="130" y2="34" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-dark)"/>
  <line x1="130" y1="265" x2="540" y2="265" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-dark)"/>
  <line x1="130" y1="265" x2="42" y2="322" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-dark)"/>

  <text x="125" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">Z</text>
  <text x="548" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">X</text>
  <text x="24" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">Y</text>
  <text x="135" y="283" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#111827">O</text>

  <!-- Curved surface S: F(x, y, z) = 0 -->
  <path d="M 210 232 C 210 165, 290 120, 395 140 C 445 150, 465 190, 455 232 C 390 250, 270 252, 210 232 Z" fill="#e2e8f0" fill-opacity="0.45" stroke="#475569" stroke-width="1.6"/>
  <text x="415" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">S: F(x, y, z) = 0</text>

  <!-- Tangent plane at P -->
  <polygon points="188,165 362,108 468,148 294,205" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="1.6"/>
  <text x="366" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Tangent Plane</text>

  <!-- Curve on surface through P and Q -->
  <path d="M 250 220 Q 290 165 335 152 Q 380 142 420 178" fill="none" stroke="#111827" stroke-width="1.7" stroke-dasharray="4,3"/>

  <!-- Point P(x1, y1, z1) -->
  <circle cx="322" cy="156" r="4.5" fill="#111827"/>
  <text x="242" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#111827">P(x₁, y₁, z₁)</text>

  <!-- Neighbouring point Q -->
  <circle cx="378" cy="152" r="3.8" fill="#475569"/>
  <text x="386" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#475569">Q</text>

  <!-- Chord PQ -->
  <line x1="322" y1="156" x2="378" y2="152" stroke="#64748b" stroke-width="1.3"/>

  <!-- Tangent line PT -->
  <line x1="322" y1="156" x2="418" y2="132" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="424" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#2563eb">T (tangent)</text>

  <!-- Normal line PN -->
  <line x1="322" y1="156" x2="296" y2="56" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrow-red)"/>
  <text x="306" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#dc2626">Normal N</text>
  <text x="306" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#991b1b">DRs: (∂F/∂x, ∂F/∂y, ∂F/∂z)</text>

  <!-- Right-angle marker between Normal and Tangent -->
  <polyline points="319,143 332,140 335,153" fill="none" stroke="#dc2626" stroke-width="1.3"/>

  <!-- Bottom formula strip -->
  <rect x="160" y="290" width="420" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="176" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#111827">Tangent plane: (x − x₁)Fₓ + (y − y₁)Fᵧ + (z − z₁)F_z = 0</text>
  <text x="176" y="327" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Normal line: (x − x₁)/Fₓ = (y − y₁)/Fᵧ = (z − z₁)/F_z</text>
</svg>
